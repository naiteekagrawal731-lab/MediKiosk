spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB


  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mydb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}



  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always

server:
  port: 8081

# JWT secret must be at least 32 chars (256 bits) for HS256
jwt:
  secret: ${JWT_SECRET:MediKiosk-Secret-Key-2026-SIH-32c}

gemini:
  api:
    key: ${GEMINI_API_KEY:your-gemini-api-key-here}