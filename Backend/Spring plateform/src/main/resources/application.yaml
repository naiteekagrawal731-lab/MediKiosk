spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # H2 in-memory database for local testing
  datasource:
    url: jdbc:h2:mem:medikiosk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  sql:
    init:
      mode: always

server:
  port: 8081

# JWT secret must be at least 32 chars (256 bits) for HS256
jwt:
  secret: ${JWT_SECRET:MediKiosk-Secret-Key-2026-SIH-32c}

gemini:
  api:
    key: ${GEMINI_API_KEY:your-gemini-api-key-here}